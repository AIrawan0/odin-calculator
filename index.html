<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik+Iso&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>CALCULATOR</header>
    <main>
        <div class="container">
            <div class="display">
                <div class="text" id="display">0</div>
            </div>
            <div class="keyboard">
                <div class="key" id="num1">1</div>
                <div class="key">2</div>
                <div class="key">3</div>
                <div class="key">C</div>
                <div class="key">4</div>
                <div class="key">5</div>
                <div class="key">6</div>
                <div class="key">+</div>
                <div class="key">7</div>
                <div class="key">8</div>
                <div class="key">9</div>
                <div class="key">-</div>
                <div class="key">.</div>
                <div class="key">0</div>
                <div class="key">*</div>
                <div class="key">/</div>
            </div>
            <div class="submit" id="submit">=</div>
        </div>
    </main>
    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
